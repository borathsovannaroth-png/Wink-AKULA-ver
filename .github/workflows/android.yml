
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find ZIP
        id: zip
        run: |
          ZIP_FILE=$(find . -type f -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository!"
            find . -maxdepth 3 -type f
            exit 1
          fi
          echo "Found: $ZIP_FILE"
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q "${{ steps.zip.outputs.file }}" -d project

      - name: Build APK
        run: gradle --no-daemon assembleDebug
        working-directory: project

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AKULA-WINK-PRO-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
